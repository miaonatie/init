name: IoT environment

on:
  push:
    paths: [init.py, 'iot/**', 'tests/*iot*', '.github/workflows/iot.yml']
  pull_request:
    paths: [init.py, 'iot/**', 'tests/*iot*', '.github/workflows/iot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:18.04', 'ubuntu:20.04', 'ubuntu:24.04', 'kalilinux/kali-rolling']
    steps:
      - uses: actions/checkout@v4
      - name: Test legacy and merged QEMU packages with real chroot execution
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -v /etc/ssl/certs/ca-certificates.crt:/tmp/host-ca.crt:ro "$IMAGE" bash -ec '
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ ! -f "$source" ] || sed -i "s|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g" "$source"
            done
            apt-get -o Acquire::Retries=3 -o Acquire::https::CaInfo=/tmp/host-ca.crt update -qq
            apt-get -o Acquire::https::CaInfo=/tmp/host-ca.crt install -y --no-install-recommends python3 ca-certificates binutils qemu-user squashfs-tools
            python3 -c "from init import Bootstrap; b=Bootstrap(); assert b.install_qemu_static(), b.failures"
            python3 tests/smoke_iot.py --qemu-only
            python3 -c "from init import Bootstrap; b=Bootstrap(); assert b.install_qemu_static(), b.failures"
          '

  old-ubuntu-iot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:18.04', 'ubuntu:20.04']
    steps:
      - uses: actions/checkout@v4
      - name: Install, exercise and repeat IoT tools on old Ubuntu
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -v /etc/ssl/certs/ca-certificates.crt:/tmp/host-ca.crt:ro "$IMAGE" bash -ec '
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ ! -f "$source" ] || sed -i "s|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g" "$source"
            done
            apt-get -o Acquire::Retries=3 -o Acquire::https::CaInfo=/tmp/host-ca.crt update -qq
            apt-get -o Acquire::https::CaInfo=/tmp/host-ca.crt install -y --no-install-recommends python3 ca-certificates curl git
            python3 -c "from init import Bootstrap; b=Bootstrap(); b.install_iot_environment(); b.verify_iot(); assert not b.failures, b.failures"
            python3 tests/smoke_iot.py
            python3 -c "from init import Bootstrap; b=Bootstrap(); b.install_iot_environment(); b.verify_iot(); assert not b.failures, b.failures"
          '

  iot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install IoT tools and build FirmAE image
        run: python3 init.py --iot
      - name: Execute foreign ELF and FirmAE device/database tests
        run: python3 tests/smoke_iot.py --firmae
      - name: Check repeat installation and read-only verification
        run: |
          python3 init.py --iot
          python3 init.py --iot-check
      - name: Container diagnostics
        if: failure()
        run: firmae logs || true
