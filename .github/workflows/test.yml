name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile init.py tests/test_init.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n config/shell.sh
      - name: Help smoke test
        run: python3 init.py --help
