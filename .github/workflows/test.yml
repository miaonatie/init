name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  install:
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:18.04", "ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:13", "kalilinux/kali-rolling"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install, verify and run again
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src:ro" -w /src "$IMAGE" sh -ec '
              apt-get -o Acquire::Retries=2 update -qq
              apt-get -y -qq --no-install-recommends install python3
              python3 init.py
              python3 -m unittest discover -s tests -q
              python3 init.py >/tmp/init-repeat.log
              cat /tmp/init-repeat.log
              ! grep -q "^  \[update\]" /tmp/init-repeat.log
            '
