name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q init.py tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Help smoke test
        run: python3 init.py --help

  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:18.04", "ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "kalilinux/kali-rolling"]
        account: [root]
        include:
          - image: "ubuntu:24.04"
            account: tester
    steps:
      - uses: actions/checkout@v4
      - name: Install, verify, repair and repeat in real environment
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          ACCOUNT: ${{ matrix.account }}
        run: |
          set -o pipefail
          docker run --rm -e TERM=xterm -e PYTHONUNBUFFERED=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e ACCOUNT -v "$PWD:/src:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/tmp/host-ca.crt:ro \
            -w /src "$IMAGE" bash -ec '
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ ! -f "$source" ] || sed -i "s|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g" "$source"
            done
            apt-get -o Acquire::Retries=3 -o Acquire::https::CaInfo=/tmp/host-ca.crt update -qq
            apt-get -o Acquire::https::CaInfo=/tmp/host-ca.crt install -y --no-install-recommends python3 ca-certificates curl sudo
            python3 init.py --help
            python3 -m unittest discover -s tests -q
            if [ "$ACCOUNT" = tester ]; then
              useradd -m -s /bin/bash tester
              echo "tester ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/tester
              chmod 440 /etc/sudoers.d/tester
              runuser -u tester -- env HOME=/home/tester python3 tests/smoke_environment.py
            else
              python3 tests/smoke_environment.py
            fi
          ' 2>&1 | tee environment.log
      - name: Preserve integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ strategy.job-index }}
          path: environment.log
          retention-days: 7
