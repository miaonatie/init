name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile init.py tests/test_init.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Help smoke test
        run: python3 init.py --help

  pwn-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:18.04", "ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "kalilinux/kali-rolling"]
    steps:
      - uses: actions/checkout@v4
      - name: Install and exercise Pwn core commands
        run: |
          docker run --rm -e TERM=xterm -v "$PWD:/src:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/tmp/host-ca.crt:ro \
            -w /src ${{ matrix.image }} bash -ec '
            if [ -f /etc/apt/sources.list ]; then
              sed -i "s|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g" /etc/apt/sources.list
            fi
            apt-get -o Acquire::Retries=3 -o Acquire::https::CaInfo=/tmp/host-ca.crt update -qq
            apt-get -o Acquire::https::CaInfo=/tmp/host-ca.crt install -y --no-install-recommends python3 ca-certificates curl
            python3 init.py --help
            python3 tests/smoke_pwn.py
          '
