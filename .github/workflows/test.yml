name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile init.py tests/test_init.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Help smoke test
        run: python3 init.py --help

  ubuntu-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["18.04", "20.04", "22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Distro Python startup and core package resolution
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:${{ matrix.ubuntu }} bash -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 ca-certificates
            python3 init.py --help
            python3 - <<"PY"
          import init
          b = init.Bootstrap()
          assert b.supported_distro(b.distro), b.distro
          assert b.run(["true"], capture=True).returncode == 0
          b.apt_updated = True
          packages = b.compatible_packages(init.REQUIRED_APT)
          missing = [p for p in packages if not b.package_available(p)]
          assert not missing, missing
          PY
          '
