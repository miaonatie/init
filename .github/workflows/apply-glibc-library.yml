name: apply-glibc-library

on:
  push:
    branches: [feature/glibc-library-index]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glibc-library-index
      - name: Apply patch
        run: |
          python3 tools/apply_glibc_library_patch.py
          python3 tools/fix_glibc_tests.py
      - name: Remove temporary patch machinery
        run: rm -f tools/apply_glibc_library_patch.py tools/fix_glibc_tests.py .github/workflows/apply-glibc-library.yml
      - name: Syntax and unit tests
        run: |
          python3 -m py_compile init.py tests/test_init.py
          python3 -m unittest discover -s tests -v
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add compact multi-version glibc library' || exit 0
          git push origin HEAD:feature/glibc-library-index
